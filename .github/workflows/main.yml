name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unpack zips and find project
        id: p
        run: |
          mkdir -p proj
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d "proj/${z%.zip}"; done
          f=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then echo "No project found"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> $GITHUB_OUTPUT

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: buddy-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
